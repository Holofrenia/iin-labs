document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

und=\"#05070a\"><\u002Fthree-d-stage>\n<h1 id=\"title\">IIN-002<\u002Fh1>\n<p id=\"hint\">DRAG DROPLETS TO SCULPT WITH SOUND<\u002Fp>\n<div id=\"hud\">\n  <button id=\"lang\" type=\"button\">EN / ES<\u002Fbutton>\n  <button id=\"sound-toggle\" data-on=\"true\" type=\"button\">SOUND ON<\u002Fbutton>\n  <input id=\"volume\" type=\"range\" min=\"0\" max=\"100\" value=\"80\" aria-label=\"volume\">\n  <button id=\"reset\" type=\"button\">RESET<\u002Fbutton>\n<\u002Fdiv>\n<script>\n  (function () {\n    const STR = {\n      en: { hint: 'DRAG DROPLETS TO SCULPT WITH SOUND', on: 'SOUND ON', off: 'SOUND OFF', reset: 'RESET' },\n      es: { hint: 'ARRASTRA GOTAS PARA ESCULPIR CON SONIDO', on: 'SONIDO ON', off: 'SONIDO OFF', reset: 'REINICIAR' }\n    };\n    let lang = 'en';\n    const hint = document.getElementById('hint');\n    const snd = document.getElementById('sound-toggle');\n    const rst = document.getElementById('reset');\n    const paint = () => {\n      const s = STR[lang];\n      hint.textContent = s.hint;\n      snd.textContent = snd.getAttribute('data-on') === 'true' ? s.on : s.off;\n      rst.textContent = s.reset;\n      document.documentElement.lang = lang;\n    };\n    window.__scenePaint = paint;\n    document.getElementById('lang').addEventListener('click', () => {\n      lang = lang === 'en' ? 'es' : 'en';\n      paint();\n      if (window.__iinLabels) window.__iinLabels(lang);\n    });\n    paint();\n  })();\n<\u002Fscript>\n<div id=\"panel\" data-open=\"true\">\n  <div class=\"sec\">\n    <h2 data-i18n=\"eq\">SPECTRUM<\u002Fh2>\n    <div class=\"row\"><label data-i18n=\"low\">LOW<\u002Flabel><input id=\"eq-low\" type=\"range\" min=\"-40\" max=\"18\" value=\"0\"><output>0<\u002Foutput><\u002Fdiv>\n    <div class=\"row\"><label data-i18n=\"mid\">MID<\u002Flabel><input id=\"eq-mid\" type=\"range\" min=\"-40\" max=\"18\" value=\"0\"><output>0<\u002Foutput><\u002Fdiv>\n    <div class=\"row\"><label data-i18n=\"high\">HIGH<\u002Flabel><input id=\"eq-high\" type=\"range\" min=\"-40\" max=\"18\" value=\"0\"><output>0<\u002Foutput><\u002Fdiv>\n    <div class=\"row\"><label data-i18n=\"tilt\">CUTOFF<\u002Flabel><input id=\"eq-cut\" type=\"range\" min=\"200\" max=\"12000\" value=\"5400\"><output>5.4k<\u002Foutput><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec\">\n    <h2 data-i18n=\"time\">TIME<\u002Fh2>\n    <div class=\"row\"><label data-i18n=\"tempo\">TEMPO<\u002Flabel><input id=\"tempo\" type=\"range\" min=\"20\" max=\"300\" value=\"100\"><output>1.00<\u002Foutput><\u002Fdiv>\n    <div class=\"row\"><label data-i18n=\"flow\">FLOW<\u002Flabel><input id=\"flow\" type=\"range\" min=\"20\" max=\"300\" value=\"100\"><output>1.00<\u002Foutput><\u002Fdiv>\n    <div class=\"row\"><label data-i18n=\"flicker\">FLICKER<\u002Flabel><input id=\"flicker\" type=\"range\" min=\"10\" max=\"400\" value=\"100\"><output>1.00<\u002Foutput><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec\">\n    <h2 data-i18n=\"bin\">BINAURAL<\u002Fh2>\n    <div class=\"row\"><label data-i18n=\"beat\">BEAT<\u002Flabel><input id=\"bin-rate\" type=\"range\" min=\"0\" max=\"140\" value=\"0\"><output>0.0<\u002Foutput><\u002Fdiv>\n    <div class=\"row\"><label data-i18n=\"carrier\">CARRIER<\u002Flabel><input id=\"bin-carrier\" type=\"range\" min=\"60\" max=\"320\" value=\"136\"><output>136<\u002Foutput><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec\">\n    <h2 data-i18n=\"space\">SPACE · 3D<\u002Fh2>\n    <div class=\"row\"><label data-i18n=\"spread\">SPREAD<\u002Flabel><input id=\"sp-spread\" type=\"range\" min=\"30\" max=\"260\" value=\"100\"><output>1.00<\u002Foutput><\u002Fdiv>\n    <div class=\"row\"><label data-i18n=\"height\">HEIGHT<\u002Flabel><input id=\"sp-height\" type=\"range\" min=\"-100\" max=\"100\" value=\"0\"><output>0.00<\u002Foutput><\u002Fdiv>\n    <div class=\"row\"><label data-i18n=\"orbit\">ORBIT<\u002Flabel><input id=\"sp-orbit\" type=\"range\" min=\"-100\" max=\"100\" value=\"0\"><output>0.00<\u002Foutput><\u002Fdiv>\n    <div class=\"row\"><label data-i18n=\"width\">WIDTH<\u002Flabel><input id=\"sp-width\" type=\"range\" min=\"0\" max=\"200\" value=\"100\"><output>1.00<\u002Foutput><\u002Fdiv>\n  <\u002Fdiv>\n  <div class=\"sec\">\n    <h2 data-i18n=\"colour\">COLOUR<\u002Fh2>\n    <div id=\"wheels\">\n      <div>\n        <canvas id=\"w-hue\" width=\"112\" height=\"112\"><\u002Fcanvas>\n        <p class=\"wlab\" data-i18n=\"wHue\">HUE · SAT<\u002Fp>\n      <\u002Fdiv>\n      <div>\n        <canvas id=\"w-rgba\" width=\"112\" height=\"112\"><\u002Fcanvas>\n        <p class=\"wlab\" data-i18n=\"wRgba\">RGBA · LEVEL<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"row\"><label data-i18n=\"alpha\">ALPHA<\u002Flabel><input id=\"c-alpha\" type=\"range\" min=\"20\" max=\"100\" value=\"85\"><output>0.85<\u002Foutput><\u002Fdiv>\n    <div class=\"bar\">\n      <button id=\"pal-save\" type=\"button\" data-i18n=\"pSave\">SAVE PALETTE<\u002Fbutton>\n      <button id=\"pal-load\" type=\"button\" data-i18n=\"pLoad\">LOAD PALETTE<\u002Fbutton>\n    <\u002Fdiv>\n    <input id=\"pal-file\" type=\"file\" accept=\".js,.json\" style=\"display:none\">\n    <div id=\"harmony\">\n      <button class=\"horb\" id=\"h-mono\" type=\"button\" data-on=\"false\" title=\"mono\"><\u002Fbutton>\n      <button class=\"horb\" id=\"h-triad\" type=\"button\" data-on=\"true\" title=\"triad\"><\u002Fbutton>\n      <button class=\"horb\" id=\"h-tetrad\" type=\"button\" data-on=\"false\" title=\"tetrad\"><\u002Fbutton>\n    <\u002Fdiv>\n    <p class=\"hlab\" data-i18n=\"hlab\">MONO · TRIAD · TETRAD<\u002Fp>\n  <\u002Fdiv>\n  <div class=\"sec\">\n    <h2 data-i18n=\"mix\">MIX<\u002Fh2>\n    <div class=\"bar\">\n      <button id=\"mix-reset\" type=\"button\" data-i18n=\"bReset\">RESET<\u002Fbutton>\n      <button id=\"mix-save\" type=\"button\" data-i18n=\"bSave\">SAVE .JS<\u002Fbutton>\n      <button id=\"mix-load\" type=\"button\" data-i18n=\"bLoad\">LOAD .JS<\u002Fbutton>\n    <\u002Fdiv>\n    <input id=\"mix-file\" type=\"file\" accept=\".js,.json\" style=\"display:none\">\n  <\u002Fdiv>\n  <div class=\"sec\">\n    <h2 data-i18n=\"patch\">SEQUENCER · POLYRHYTHM<\u002Fh2>\n    <div id=\"patch\">\n      <svg id=\"cables\" viewBox=\"0 0 260 200\" preserveAspectRatio=\"none\"><\u002Fsvg>\n      <div class=\"vhead\"><span data-i18n=\"hVoice\">VOICE<\u002Fspan><span>N<\u002Fspan><span data-i18n=\"hLevel\">LEVEL<\u002Fspan><span data-i18n=\"hTone\">TONE<\u002Fspan><\u002Fdiv>\n      <div id=\"vrows\"><\u002Fdiv>\n    <\u002Fdiv>\n    <p class=\"note\" data-i18n=\"note\">N = PULSES BETWEEN HITS · EQUAL N ARE CABLED TOGETHER<\u002Fp>\n  <\u002Fdiv>\n<\u002Fdiv>\n<button id=\"panel-toggle\" type=\"button\">PANEL<\u002Fbutton>\n<script>\n  (function () {\n    const CELLS = ['VEIL I', 'VEIL II', 'JET', 'TONGUE', 'CORE', 'GRIT'];\n    const DEF_N = [27, 13, 3, 5, 7, 11];\n    const state = {\n      eq: { low: 0, mid: 0, high: 0, cut: 5400 },\n      tempo: 1, flow: 1, flicker: 1,\n      binRate: 0, binCarrier: 136,\n      space: { spread: 1, height: 0, orbit: 0, width: 1 },\n      voices: CELLS.map((name, i) => ({ name, n: DEF_N[i], level: 1, tone: 0.6 }))\n    };\n    window.__iin = state;\n\n    const rowsHost = document.getElementById('vrows');\n    const svg = document.getElementById('cables');\n    const numEls = [];\n\n    const drawCables = () => {\n      const host = document.getElementById('patch');\n      const hb = host.getBoundingClientRect();\n      if (!hb.width) return;\n      svg.setAttribute('viewBox', '0 0 ' + hb.width + ' ' + hb.height);\n      const groups = {};\n      numEls.forEach((el, i) => {\n        const n = state.voices[i].n;\n        if (!n) return;\n        (groups[n] = groups[n] || []).push(el);\n      });\n      let d = '';\n      Object.values(groups).forEach((g) => {\n        for (let k = 0; k < g.length - 1; k++) {\n          const A = g[k].getBoundingClientRect(), B = g[k + 1].getBoundingClientRect();\n          const x1 = A.left - hb.left + A.width / 2, y1 = A.bottom - hb.top - 2;\n          const x2 = B.left - hb.left + B.width / 2, y2 = B.top - hb.top + 2;\n          const sag = Math.max(16, Math.abs(y2 - y1) * 0.6);\n          d += 'M' + x1 + ' ' + y1 + ' C' + (x1 - sag) + ' ' + (y1 + sag) + ' ' + (x2 - sag) + ' ' + (y2 - sag) + ' ' + x2 + ' ' + y2 + ' ';\n        }\n      });\n      svg.innerHTML = d ? '<path d=\"' + d + '\" fill=\"none\" stroke=\"rgba(240,180,41,0.55)\" stroke-width=\"1.4\" stroke-linecap=\"round\"/>' : '';\n    };\n\n    state.voices.forEach((v, i) => {\n      const row = document.createElement('div');\n      row.className = 'vrow';\n      const nm = document.createElement('span');\n      nm.className = 'vname';\n      nm.textContent = v.name;\n      const num = document.createElement('input');\n      num.type = 'number'; num.min = '0'; num.max = '64'; num.step = '1'; num.value = String(v.n);\n      num.addEventListener('input', () => {\n        const n = Math.max(0, Math.min(64, Math.round(Number(num.value) || 0)));\n        v.n = n;\n        drawCables();\n      });\n      const lvl = document.createElement('input');\n      lvl.type = 'range'; lvl.min = '0'; lvl.max = '150'; lvl.value = '100';\n      lvl.addEventListener('input', () => { v.level = Number(lvl.value) / 100; });\n      const tone = document.createElement('input');\n      tone.type = 'range'; tone.min = '0'; tone.max = '100'; tone.value = '60';\n      tone.addEventListener('input', () => { v.tone = Number(tone.value) / 100; });\n      row.appendChild(nm); row.appendChild(num); row.appendChild(lvl); row.appendChild(tone);\n      rowsHost.appendChild(row);\n      numEls.push(num);\n    });\n\n    const bind = (id, set, fmt, map) => {\n      const el = document.getElementById(id);\n      const out = el.parentElement.querySelector('output');\n      const sync = () => {\n        const v = map ? map(Number(el.value)) : Number(el.value);\n        set(v);\n        out.textContent = fmt(v);\n      };\n      el.addEventListener('input', sync);\n      sync();\n    };\n    const one = (v) => v.toFixed(2);\n    bind('eq-low', (v) => (state.eq.low = v), (v) => String(Math.round(v)));\n    bind('eq-mid', (v) => (state.eq.mid = v), (v) => String(Math.round(v)));\n    bind('eq-high', (v) => (state.eq.high = v), (v) => String(Math.round(v)));\n    bind('eq-cut', (v) => (state.eq.cut = v), (v) => (v >= 1000 ? (v / 1000).toFixed(1) + 'k' : String(Math.round(v))));\n    bind('tempo', (v) => (state.tempo = v), one, (v) => v / 100);\n    bind('flow', (v) => (state.flow = v), one, (v) => v / 100);\n    bind('flicker', (v) => (state.flicker = v), one, (v) => v / 100);\n    bind('bin-rate', (v) => (state.binRate = v), (v) => v.toFixed(1), (v) => v / 10);\n    bind('bin-carrier', (v) => (state.binCarrier = v), (v) => String(Math.round(v)));\n    bind('sp-spread', (v) => (state.space.spread = v), one, (v) => v / 100);\n    bind('sp-height', (v) => (state.space.height = v), one, (v) => v / 100);\n    bind('sp-orbit', (v) => (state.space.orbit = v), one, (v) => v / 100);\n    bind('sp-width', (v) => (state.space.width = v), one, (v) => v / 100);\n\n    const panel = document.getElementById('panel');\n    document.getElementById('panel-toggle').addEventListener('click', () => {\n      panel.setAttribute('data-open', panel.getAttribute('data-open') === 'true' ? 'false' : 'true');\n      setTimeout(drawCables, 380);\n    });\n    // ---- presets: every control is registered so save/load/reset stay in sync ----\n    const CONTROLS = [\n      ['eq-low', 'eq.low'], ['eq-mid', 'eq.mid'], ['eq-high', 'eq.high'], ['eq-cut', 'eq.cut'],\n      ['tempo', 'tempo'], ['flow', 'flow'], ['flicker', 'flicker'],\n      ['bin-rate', 'binRate'], ['bin-carrier', 'binCarrier'],\n      ['sp-spread', 'space.spread'], ['sp-height', 'space.height'], ['sp-orbit', 'space.orbit'], ['sp-width', 'space.width']\n    ];\n    const defaults = {};\n    CONTROLS.forEach(([id]) => { defaults[id] = document.getElementById(id).value; });\n    const voiceDefaults = state.voices.map((v, i) => ({ n: DEF_N[i], level: 100, tone: 60 }));\n\n    const setSlider = (id, value) => {\n      const el = document.getElementById(id);\n      if (!el || value === undefined || value === null) return;\n      el.value = String(value);\n      el.dispatchEvent(new Event('input', { bubbles: true }));\n    };\n\n    const snapshot = () => ({\n      version: 1,\n      sliders: CONTROLS.reduce((acc, [id]) => (acc[id] = document.getElementById(id).value, acc), {}),\n      voices: state.voices.map((v, i) => ({\n        name: v.name,\n        n: v.n,\n        level: Math.round(rowsHost.children[i].children[2].value),\n        tone: Math.round(rowsHost.children[i].children[3].value)\n      }))\n    });\n\n    const applyMix = (mix) => {\n      if (!mix) return;\n      if (mix.sliders) Object.entries(mix.sliders).forEach(([id, v]) => setSlider(id, v));\n      if (Array.isArray(mix.voices)) {\n        mix.voices.forEach((mv, i) => {\n          const row = rowsHost.children[i];\n          if (!row) return;\n          if (mv.n !== undefined) { row.children[1].value = String(mv.n); row.children[1].dispatchEvent(new Event('input', { bubbles: true })); }\n          if (mv.level !== undefined) { row.children[2].value = String(mv.level); row.children[2].dispatchEvent(new Event('input', { bubbles: true })); }\n          if (mv.tone !== undefined) { row.children[3].value = String(mv.tone); row.children[3].dispatchEvent(new Event('input', { bubbles: true })); }\n        });\n      }\n      drawCables();\n    };\n\n    document.getElementById('mix-reset').addEventListener('click', () => {\n      applyMix({ sliders: defaults, voices: voiceDefaults });\n    });\n\n    document.getElementById('mix-save').addEventListener('click', () => {\n      const mix = snapshot();\n      const body = '// IIN-002 mix · ' + new Date().toISOString() + '\\n'\n        + 'export const mix = ' + JSON.stringify(mix, null, 2) + ';\\n'\n        + 'if (typeof window !== \"undefined\") window.__iinMix = mix;\\n';\n      const url = URL.createObjectURL(new Blob([body], { type: 'text/javascript' }));\n      const a = document.createElement('a');\n      a.href = url;\n      a.download = 'iin-002-mix-' + Date.now() + '.js';\n      a.click();\n      setTimeout(() => URL.revokeObjectURL(url), 4000);\n    });\n\n    const fileEl = document.getElementById('mix-file');\n    document.getElementById('mix-load').addEventListener('click', () => fileEl.click());\n    fileEl.addEventListener('change', () => {\n      const f = fileEl.files && fileEl.files[0];\n      if (!f) return;\n      const rd = new FileReader();\n      rd.onload = () => {\n        const txt = String(rd.result);\n        const at = txt.indexOf('{');\n        const end = txt.lastIndexOf('}');\n        try { applyMix(JSON.parse(txt.slice(at, end + 1))); } catch (e) { /* malformed file */ }\n        fileEl.value = '';\n      };\n      rd.readAsText(f);\n    });\n\n    // ---------- colour engine: hue/sat wheel + rgba level wheel + harmony ----------\n    const colour = { hue: 168, sat: 0.62, val: 0.86, alpha: 0.85, mode: 'triad' };\n    state.colour = colour;\n\n    const hsvToRgb = (h, s, v) => {\n      h = ((h % 360) + 360) % 360;\n      const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;\n      const t = [[c, x, 0], [x, c, 0], [0, c, x], [0, x, c], [x, 0, c], [c, 0, x]][Math.floor(h / 60) % 6];\n      return [t[0] + m, t[1] + m, t[2] + m];\n    };\n    const css = (h, s, v, a) => {\n      const [r, g, b] = hsvToRgb(h, s, v);\n      const q = (n) => Math.round(Math.max(0, Math.min(1, n)) * 255);\n      return a === undefined ? 'rgb(' + q(r) + ',' + q(g) + ',' + q(b) + ')'\n                             : 'rgba(' + q(r) + ',' + q(g) + ',' + q(b) + ',' + a + ')';\n    };\n    const OFFSETS = { mono: [0, 14, -14, 26, -26, 8], triad: [0, 120, 240, 60, 180, 300], tetrad: [0, 90, 180, 270, 45, 225] };\n    const scheme = () => OFFSETS[colour.mode].map((o, i) => ({\n      h: colour.hue + o,\
